name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify tag matches package version
        run: node --input-type=module -e "import fs from 'node:fs'; if ('v' + JSON.parse(fs.readFileSync('package.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm publish --provenance --access public
